<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Medical Flashcards + TTS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    background:linear-gradient(135deg,#eef4ff 0%,#f6f0ff 50%,#eafaf7 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:14px;color:#1e293b;
  }
  .app{width:100%;max-width:720px}

  header{text-align:center;margin-bottom:14px}
  header h1{
    font-size:clamp(17px,4.5vw,23px);font-weight:800;letter-spacing:-.4px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);-webkit-background-clip:text;
    background-clip:text;color:transparent;
  }
  header p{font-size:clamp(11px,3vw,13px);color:#64748b;margin-top:3px}

  .bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .3s}

  .meta{display:flex;justify-content:space-between;align-items:center;
    font-size:clamp(11px,3vw,13px);color:#64748b;font-weight:600;margin-bottom:8px;padding:0 2px}

  .scene{perspective:1600px;height:clamp(300px,50vh,400px);cursor:pointer;outline:none}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.15,.2,1)}
  .card.flipped{transform:rotateY(180deg)}

  .face{
    position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
    border-radius:22px;padding:clamp(16px,4vw,30px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;overflow-y:auto;
    box-shadow:0 18px 40px rgba(30,58,138,.14),0 2px 8px rgba(30,58,138,.06);
  }
  .front{background:#fff;border:1px solid #e6ecf7}
  .back{background:linear-gradient(140deg,#2563eb,#5b21b6 70%,#7c3aed);color:#fff;
    transform:rotateY(180deg);justify-content:flex-start;padding-top:clamp(20px,5vw,34px)}

  .pos{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:#2563eb;background:#e0ecff;padding:4px 12px;border-radius:99px;margin-bottom:12px;
  }
  .back .pos{color:#fff;background:rgba(255,255,255,.22);margin-bottom:14px}

  .word{font-size:clamp(24px,6.5vw,40px);font-weight:800;line-height:1.18;letter-spacing:-.5px;word-break:break-word}
  .ipa{font-size:clamp(13px,3.6vw,17px);color:#7c3aed;margin-top:10px;font-weight:500;font-family:'Segoe UI',sans-serif}

  .meaning{font-size:clamp(20px,5.2vw,30px);font-weight:800;line-height:1.25;margin-bottom:16px;word-break:break-word}
  .divider{width:56px;height:3px;border-radius:9px;background:rgba(255,255,255,.5);margin:0 auto 16px}
  .ex{font-size:clamp(13px,3.6vw,16px);font-style:italic;line-height:1.5;opacity:.97;margin-bottom:8px}
  .exvi{font-size:clamp(12px,3.3vw,15px);line-height:1.5;opacity:.85}

  .hint{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:#94a3b8;font-weight:600;letter-spacing:.4px}
  .back .hint{color:rgba(255,255,255,.7)}

  .controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:16px}
  button{
    font-family:inherit;font-size:clamp(12px,3.3vw,14px);font-weight:700;
    padding:13px 8px;border-radius:14px;border:none;cursor:pointer;
    background:#fff;color:#334155;box-shadow:0 4px 14px rgba(30,58,138,.10);
    transition:transform .12s ease,box-shadow .2s,background .2s;user-select:none;
  }
  button:active{transform:scale(.96)}
  button.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;
    box-shadow:0 8px 20px rgba(59,88,235,.32)}
  button.primary:hover{box-shadow:0 10px 26px rgba(59,88,235,.42)}
  button.ghost:hover{background:#f1f5ff}
  button:disabled{opacity:.42;cursor:not-allowed}

  .tools{display:flex;gap:10px;margin-top:10px}
  .tools button{flex:1;background:transparent;box-shadow:none;color:#64748b;font-weight:600;
    border:1.5px dashed #cbd5e1;font-size:clamp(11px,3vw,13px);padding:10px}
  .tools button:hover{background:#fff;color:#2563eb;border-color:#93b4f8}

  /* --- TTS UI --- */
  .tts-bar{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin-top:10px;flex-wrap:wrap;
  }
  .tts-bar label{
    display:flex;align-items:center;gap:6px;
    font-size:clamp(11px,3vw,13px);color:#475569;cursor:pointer;
    background:#fff;padding:8px 14px;border-radius:99px;
    box-shadow:0 2px 8px rgba(30,58,138,.06);
  }
  .tts-bar input[type="checkbox"]{accent-color:#2563eb;width:16px;height:16px;cursor:pointer}

  .speak-btn{
    background:none;border:none;cursor:pointer;
    width:42px;height:42px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:none;padding:0;
    color:#2563eb;font-size:22px;
    transition:background .2s,transform .15s;
    flex-shrink:0;
  }
  .speak-btn:hover{background:rgba(37,99,235,.1)}
  .speak-btn:active{transform:scale(.9)}
  .back .speak-btn{color:#fff}
  .back .speak-btn:hover{background:rgba(255,255,255,.18)}

  .word-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .example-row{display:flex;align-items:flex-start;justify-content:center;gap:8px;flex-wrap:wrap}

  /* Trạng thái đang đọc */
  .speaking{animation:pulse 0.9s infinite;}
  @keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }

  @media(max-width:420px){
    .controls{grid-template-columns:1fr 1.4fr 1fr;gap:7px}
    button{padding:12px 4px;border-radius:12px}
    .speak-btn{width:36px;height:36px;font-size:19px}
  }
  @media(min-width:900px){
    .scene:hover .card:not(.flipped){transform:rotateY(4deg) scale(1.008)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🩺 Medical Flashcards</h1>
    <p>Nhấn vào thẻ để lật xem nghĩa · Dùng ← → để chuyển · 🔊 để nghe</p>
  </header>

  <div class="meta">
    <span id="counter">1 / 1</span>
    <span id="percent">0%</span>
  </div>
  <div class="bar"><i id="progress"></i></div>

  <div class="scene" id="scene" tabindex="0">
    <div class="card" id="card">
      <!-- FRONT -->
      <div class="face front">
        <div class="pos" id="posFront">noun</div>
        <div class="word-row">
          <span class="word" id="word">—</span>
          <button class="speak-btn" id="speakWordBtn" title="Đọc từ này" aria-label="Đọc từ">🔊</button>
        </div>
        <div class="ipa" id="ipa">—</div>
        <div class="hint">NHẤN ĐỂ XEM NGHĨA</div>
      </div>
      <!-- BACK -->
      <div class="face back">
        <div class="pos" id="posBack">noun</div>
        <div class="meaning" id="meaning">—</div>
        <div class="divider"></div>
        <div class="example-row">
          <div>
            <div class="ex" id="ex">—</div>
            <div class="exvi" id="exvi">—</div>
          </div>
          <button class="speak-btn" id="speakExampleBtn" title="Đọc câu ví dụ" aria-label="Đọc câu ví dụ">🔊</button>
        </div>
        <div class="hint">NHẤN ĐỂ QUAY LẠI</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ghost" id="prev">← Trước</button>
    <button class="primary" id="flip">Lật thẻ</button>
    <button class="ghost" id="next">Sau →</button>
  </div>
  <div class="tools">
    <button id="shuffle">🔀 Xáo trộn</button>
    <button id="reset">↺ Ban đầu</button>
  </div>

  <!-- TTS Controls -->
  <div class="tts-bar">
    <label>
      <input type="checkbox" id="autoSpeakToggle" checked>
      Tự động đọc
    </label>
    <label style="cursor:default">
      <span id="ttsStatus" style="font-size:11px;color:#94a3b8;">TTS sẵn sàng</span>
    </label>
  </div>
</div>

<!-- Puter.js: Online TTS không cần API key -->
<script src="https://js.puter.com/v2/"></script>

<script>
/* ============================================================
   DATA – Toàn bộ từ vựng y khoa

wearable sensor|/ˈweərəbl ˈsensə/|n|cảm biến đeo|A wearable sensor tracks the heart rate.|Cảm biến đeo theo dõi nhịp tim.
wheeze|/wiːz/|n|tiếng khò khè|The wheeze was heard on exhaling.|Tiếng khò khè nghe khi thở ra.
white blood cell|/waɪt blʌd sel/|n|bạch cầu|White blood cells fight infection.|Bạch cầu chống nhiễm trùng.
whooping cough|/ˈhuːpɪŋ kɒf/|n|ho gà|Whooping cough causes fits of coughing.|Ho gà gây từng cơn ho.
wound culture|/wuːnd ˈkʌltʃə/|n|cấy vết thương|Wound culture guided the antibiotics.|Cấy vết thương định hướng kháng sinh.
wound debridement|/wuːnd dɪˈbriːdmənt/|n|cắt lọc vết thương|Wound debridement removed dead tissue.|Cắt lọc vết thương loại bỏ mô chết.
wrist joint|/rɪst dʒɔɪnt/|n|khớp cổ tay|The wrist joint was sprained.|Khớp cổ tay bị bong gân.
x-ray|/ˈeks reɪ/|n|tia X|The x-ray showed a fracture.|Tia X cho thấy gãy xương.
xerostomia|/ˌzɪərəʊˈstəʊmiə/|n|khô miệng|Xerostomia is common in older adults.|Khô miệng phổ biến ở người già.
yeast infection|/jiːst ɪnˈfekʃn/|n|nhiễm nấm men|A yeast infection causes itching.|Nhiễm nấm men gây ngứa.
yellow fever|/ˈjeləʊ ˈfiːvə/|n|sốt vàng|Yellow fever spreads by mosquitoes.|Sốt vàng lây qua muỗi.
yolk sac|/jəʊk sæk/|n|túi noãn hoàng|The yolk sac nourishes the embryo.|Túi noãn hoàng nuôi phôi.
zona pellucida|/ˈzəʊnə pəˈluːsɪdə/|n|màng trong suốt|The zona pellucida surrounds the egg.|Màng trong suốt bao quanh trứng.
zoonosis|/zəʊˈɒnəsɪs/|n|bệnh từ động vật sang người|Rabies is a zoonosis.|Bệnh dại lây từ động vật sang người.
zygote|/ˈzaɪɡəʊt/|n|hợp tử|The zygote divides rapidly.|Hợp tử phân chia nhanh.
zymogen|/ˈzaɪmədʒen/|n|tiền enzym|A zymogen is an inactive enzyme.|Tiền enzym là enzym chưa hoạt động.
`;

/* ============================================================
   PARSE
   ============================================================ */
const CARDS = DATA.trim().split('\n').filter(l => l.trim().length > 0).map(line => {
  const p = line.split('|');
  return { w: p[0] || '', ipa: p[1] || '', pos: p[2] || '', vi: p[3] || '', ex: p[4] || '', exvi: p[5] || '' };
});

const POS_LABEL = { n: 'DANH TỪ', v: 'ĐỘNG TỪ', adj: 'TÍNH TỪ', adv: 'TRẠNG TỪ' };

/* ============================================================
   STATE
   ============================================================ */
let order = CARDS.map((_, i) => i);
let idx = 0;
let flipped = false;
let autoSpeak = true;
let isSpeaking = false;

/* ============================================================
   DOM ELEMENTS
   ============================================================ */
const cardEl   = document.getElementById('card');
const wordEl   = document.getElementById('word');
const ipaEl    = document.getElementById('ipa');
const posF     = document.getElementById('posFront');
const posB     = document.getElementById('posBack');
const meanEl   = document.getElementById('meaning');
const exEl     = document.getElementById('ex');
const exviEl   = document.getElementById('exvi');
const counter  = document.getElementById('counter');
const percent  = document.getElementById('percent');
const progress = document.getElementById('progress');
const btnPrev  = document.getElementById('prev');
const btnNext  = document.getElementById('next');
const speakWordBtn = document.getElementById('speakWordBtn');
const speakExampleBtn = document.getElementById('speakExampleBtn');
const autoSpeakToggle = document.getElementById('autoSpeakToggle');
const ttsStatus = document.getElementById('ttsStatus');

/* ============================================================
   TTS ENGINE
   ============================================================ */
function setStatus(msg) {
  ttsStatus.textContent = msg;
  ttsStatus.style.color = '#94a3b8';
}

function speak(text, lang = 'en-US') {
  if (!text || !text.trim()) return;

  // Cancel any ongoing speech
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  setStatus('Đang đọc...');
  isSpeaking = true;

  // 1. Puter.js (online, keyless)
  if (window.puter && puter.ai && typeof puter.ai.txt2speech === 'function') {
    puter.ai.txt2speech(text, lang)
      .then(audio => {
        audio.play();
        setStatus('Puter TTS ✓');
        audio.onended = () => { setStatus('TTS sẵn sàng'); isSpeaking = false; };
        audio.onerror = () => fallbackGoogle(text, lang);
      })
      .catch(() => fallbackGoogle(text, lang));
    return;
  }

  // 2. Fallback Google Translate TTS
  fallbackGoogle(text, lang);
}

function fallbackGoogle(text, lang) {
  try {
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(text)}`;
    const audio = new Audio(url);
    audio.play()
      .then(() => {
        setStatus('Google TTS ✓');
        audio.onended = () => { setStatus('TTS sẵn sàng'); isSpeaking = false; };
        audio.onerror = () => fallbackWebSpeech(text, lang);
      })
      .catch(() => fallbackWebSpeech(text, lang));
  } catch (e) {
    fallbackWebSpeech(text, lang);
  }
}

function fallbackWebSpeech(text, lang) {
  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;
    utter.rate = 0.9;
    utter.onend = () => { setStatus('TTS sẵn sàng'); isSpeaking = false; };
    window.speechSynthesis.speak(utter);
    setStatus('Web Speech ✓');
  } else {
    setStatus('TTS không khả dụng');
    isSpeaking = false;
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const c = CARDS[order[idx]];
  wordEl.textContent = c.w;
  ipaEl.textContent  = c.ipa;
  const label = POS_LABEL[c.pos] || (c.pos || 'TỪ').toUpperCase();
  posF.textContent = label;
  posB.textContent = label;
  meanEl.textContent = c.vi;
  exEl.textContent   = c.ex;
  exviEl.textContent = c.exvi;

  if (flipped) cardEl.classList.add('flipped');
  else cardEl.classList.remove('flipped');

  counter.textContent = (idx + 1) + ' / ' + CARDS.length;
  const pct = Math.round(((idx + 1) / CARDS.length) * 100);
  percent.textContent = pct + '%';
  progress.style.width = pct + '%';

  btnPrev.disabled = idx === 0;
  btnNext.disabled = idx === CARDS.length - 1;

  // Auto-speak word when front is shown
  if (autoSpeak && !flipped) {
    setTimeout(() => speak(c.w, 'en-US'), 250);
  }
}

function toggleFlip() {
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
  const c = CARDS[order[idx]];

  if (autoSpeak) {
    if (flipped) {
      // Back side: speak example sentence
      setTimeout(() => speak(c.ex, 'en-US'), 350);
    } else {
      // Front side: speak word
      setTimeout(() => speak(c.w, 'en-US'), 250);
    }
  }
}

function go(delta) {
  const n = idx + delta;
  if (n < 0 || n >= CARDS.length) return;
  idx = n;
  flipped = false;
  cardEl.classList.remove('flipped');
  // Cancel ongoing speech
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  isSpeaking = false;
  setStatus('TTS sẵn sàng');
  render();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById('scene').addEventListener('click', toggleFlip);

document.getElementById('flip').addEventListener('click', e => {
  e.stopPropagation();
  toggleFlip();
});

btnPrev.addEventListener('click', () => go(-1));
btnNext.addEventListener('click', () => go(1));

document.getElementById('shuffle').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; flipped = false;
  cardEl.classList.remove('flipped');
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  isSpeaking = false;
  render();
});

document.getElementById('reset').addEventListener('click', () => {
  order = CARDS.map((_, i) => i);
  idx = 0; flipped = false;
  cardEl.classList.remove('flipped');
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  isSpeaking = false;
  render();
});

// Manual speak buttons
speakWordBtn.addEventListener('click', e => {
  e.stopPropagation();
  speak(CARDS[order[idx]].w, 'en-US');
});

speakExampleBtn.addEventListener('click', e => {
  e.stopPropagation();
  speak(CARDS[order[idx]].ex, 'en-US');
});

// Auto-speak toggle
autoSpeakToggle.addEventListener('change', () => {
  autoSpeak = autoSpeakToggle.checked;
  setStatus(autoSpeak ? 'Tự động đọc BẬT' : 'Tự động đọc TẮT');
  if (!autoSpeak && window.speechSynthesis) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});

// Touch swipe
let tx = 0, ty = 0;
const scene = document.getElementById('scene');
scene.addEventListener('touchstart', e => {
  tx = e.changedTouches[0].clientX;
  ty = e.changedTouches[0].clientY;
}, { passive: true });
scene.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    go(dx < 0 ? 1 : -1);
  }
}, { passive: true });

/* ============================================================
   INIT
   ============================================================ */
// Wait for Puter.js to load (if present)
if (window.puter) {
  setStatus('Puter TTS sẵn sàng');
} else {
  setStatus('TTS sẵn sàng');
}

render();
</script>
</body>
</html>
